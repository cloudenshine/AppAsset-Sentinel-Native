name: Native Build & Adversarial Tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore AppAssetSentinelNative.sln

    - name: Build Core and Applications
      run: dotnet build AppAssetSentinelNative.sln --configuration Release --no-restore

    - name: Run Full xUnit Test Suite & Adversarial Reviews
      run: dotnet test src/AppAssetSentinel.Tests/AppAssetSentinel.Tests.csproj --configuration Release --no-build --verbosity normal
